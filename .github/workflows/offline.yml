name: Offline tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test runner and scoring contracts
        run: python -m unittest discover -s tests -v
      - name: Gate on fresh synthetic evidence
        id: strict_gate
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -u
          revision=$(git rev-parse HEAD)
          run_id="$revision.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.py$PYTHON_VERSION"
          evidence=$(mktemp "$RUNNER_TEMP/strict-evidence.XXXXXXXX")
          trap 'rm -- "$evidence" || true' EXIT
          python3 -m examples.reference_evidence --run-id "$run_id" > "$evidence"
          bash examples/strict_ci.sh fixtures/suite.json "$evidence" "$run_id"
      - name: Upload sanitized strict report
        if: ${{ !cancelled() && steps.strict_gate.outputs.report_path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strict-gate-py${{ matrix.python }}-attempt${{ github.run_attempt }}
          path: ${{ steps.strict_gate.outputs.report_path }}
          if-no-files-found: error
      - name: Reproduce offline proof
        run: |
          python -m examples.reference_evidence > "$RUNNER_TEMP/observations.json"
          if ! cmp -s fixtures/observations.json "$RUNNER_TEMP/observations.json"; then
            printf '%s\n' 'Bundled observation evidence did not reproduce byte-for-byte.' >&2
            exit 1
          fi
          python -m examples.offline_proof > "$RUNNER_TEMP/proof-results.json"
          diff -u examples/proof-results.json "$RUNNER_TEMP/proof-results.json"
          python run_probes.py --strict --suite fixtures/suite.json \
            --evidence "$RUNNER_TEMP/observations.json" --expect-run reference-v2 \
            --json-out "$RUNNER_TEMP/reference-strict-report.json"
          diff -u examples/strict-gate.json "$RUNNER_TEMP/reference-strict-report.json"
