name: Offline tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test runner and scoring contracts
        run: python -m unittest discover -s tests -v
      - name: Reproduce offline proof
        run: |
          python -m examples.offline_proof > "$RUNNER_TEMP/proof-results.json"
          diff -u examples/proof-results.json "$RUNNER_TEMP/proof-results.json"
